<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Própria Aventura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Cabeçalho -->
        <header>
            <h1 id="game-title">História Interativa</h1>
        </header>

        <!-- Seleção de Temas (Aparece no início ou ao reiniciar) -->
        <div id="theme-selection" class="card">
            <h2>Escolha um Tema para Começar:</h2>
            <div class="theme-buttons">
                <button class="btn theme-btn" data-theme="fantasy">
                    🏰 Fantasia Medieval
                </button>
                <button class="btn theme-btn" data-theme="scifi">
                    🚀 Ficção Científica
                </button>
                <button class="btn theme-btn" data-theme="mystery">
                    🕵️ Mistério & Detetive
                </button>
            </div>
        </div>

        <!-- Tela do Jogo (Onde a história acontece) -->
        <div id="story-screen" class="card hidden">
            <div id="story-text" class="story-box">
                <!-- O texto da história será inserido via JavaScript -->
            </div>
           
            <div id="choices-container" class="choices-box">
                <!-- Os botões de escolha serão inseridos via JavaScript -->
            </div>
        </div>

        <!-- Tela de Fim de Jogo -->
        <div id="end-screen" class="card hidden">
            <h2 id="end-title">Fim da Aventura!</h2>
            <p id="end-text"></p>
            <button id="restart-btn" class="btn primary-btn">🎮 Jogar Novamente</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
